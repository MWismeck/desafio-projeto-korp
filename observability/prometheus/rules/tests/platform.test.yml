# observability/prometheus/rules/tests/platform.test.yml — testes unitários de borda, saturação,
# auto-monitoramento e host. Caso positivo e negativo por alerta.
# Rodar: promtool test rules platform.test.yml
rule_files:
  - ../platform.rules.yml

evaluation_interval: 1m

# group_eval_order acrescentado em 2026-09-06: sem ele o promtool ordena os grupos por mapa Go, e a
# ordem entre grupos e ALEATORIA. Os grupos de alerta leem series gravadas pelo grupo de recording,
# entao a ordem importa. Hoje estes testes passam so porque o evaluation_interval de 1m cabe no
# lookback de 5 min; com passo maior o teste falha de forma intermitente (medido em ~30% das
# execucoes num teste de 30 d). Declarar a ordem torna o resultado deterministico.
group_eval_order:
  - korp.platform.recording
  - korp.platform.alerts

tests:
  # ============================================================================================
  # Caso 1 (POSITIVO): a plataforma inteira em pane silenciosa —
  # NGINX descartando conexão, fd acabando no app, config do Prometheus não recarregada, grupo de
  # regras falhando, notificação não saindo e cardinalidade acima do orçamento.
  # Nenhum destes aparece no SLI de 5xx do serviço: é o ponto cego que estes alertas fecham.
  # ============================================================================================
  - interval: 1m
    input_series:
      # NGINX: aceita 60/min (1/s), atende 30/min (0,5/s) → 0,50 conexão/s descartada
      - series: 'nginx_connections_accepted{job="nginx",service="nginx",instance="nginx-exporter:9113"}'
        values: '0+60x40'
      - series: 'nginx_connections_handled{job="nginx",service="nginx",instance="nginx-exporter:9113"}'
        values: '0+30x40'
      # descritores: 900 de 1000 → 0,90
      - series: 'process_open_fds{job="http-server-projeto-korp",service="http-server-projeto-korp",instance="http-server-projeto-korp:8080"}'
        values: '900x40'
      - series: 'process_max_fds{job="http-server-projeto-korp",service="http-server-projeto-korp",instance="http-server-projeto-korp:8080"}'
        values: '1000x40'
      # reload do config falhou
      - series: 'prometheus_config_last_reload_successful{job="prometheus",service="prometheus",instance="localhost:9090"}'
        values: '0x40'
      # 6 falhas de avaliação por minuto → 0,1/s
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",service="prometheus",instance="localhost:9090",rule_group="http-server-projeto-korp.slo"}'
        values: '0+6x40'
      # 6 notificações falhadas por minuto → 0,1/s
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",service="alertmanager",instance="alertmanager:9093",integration="webhook"}'
        values: '0+6x40'
      # 120 spans perdidos por minuto → 2/s (nome antigo, sem _total: a regex da regra cobre os dois)
      # cardinalidade acima do orçamento de 100k
      - series: 'prometheus_tsdb_head_series{job="prometheus",service="prometheus",instance="localhost:9090"}'
        values: '150000x40'
    promql_expr_test:
      - expr: instance:nginx_connections_dropped:rate5m
        eval_time: 20m
        exp_samples:
          - labels: 'instance:nginx_connections_dropped:rate5m{job="nginx",service="nginx",instance="nginx-exporter:9113"}'
            value: 0.5
      - expr: instance:process_open_fds:ratio
        eval_time: 20m
        exp_samples:
          - labels: 'instance:process_open_fds:ratio{job="http-server-projeto-korp",service="http-server-projeto-korp",instance="http-server-projeto-korp:8080"}'
            value: 0.9
    alert_rule_test:
      - alertname: NginxConnectionsSaturated
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: sre
              job: nginx
              service: nginx
              instance: nginx-exporter:9113
            exp_annotations:
              summary: "nginx está descartando conexões TCP na borda"
              description: "accepted - handled = 0.50 conexões/s descartadas em 5 min (limite 0). O usuário vê connection reset, não 5xx — e nenhum SLI de 5xx registra isso. Subir worker_connections/limites de fd do NGINX."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#nginxconnectionssaturated"
              dashboard_url: "http://localhost:3000/d/korp-edge"

      - alertname: ProcessFileDescriptorsNearLimit
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: sre
              job: http-server-projeto-korp
              service: http-server-projeto-korp
              instance: http-server-projeto-korp:8080
            exp_annotations:
              summary: "http-server-projeto-korp perto do limite de descritores de arquivo"
              description: "process_open_fds/process_max_fds = 0.90 há 10 min em http-server-projeto-korp:8080 (limite 0.8). Ao chegar a 1 o processo para de aceitar conexão: vazamento de socket/arquivo ou LimitNOFILE baixo."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#processfiledescriptorsnearlimit"
              dashboard_url: "http://localhost:3000/d/korp-container-health"

      - alertname: PrometheusConfigReloadFailed
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: sre
              job: prometheus
              service: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "prometheus está rodando com uma configuração ANTIGA"
              description: "prometheus_config_last_reload_successful == 0 há 5 min: o último reload falhou e o processo segue com o config anterior. Jobs/regras novos NÃO estão valendo. `docker logs prometheus` e `promtool check config`."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#prometheusconfigreloadfailed"
              dashboard_url: "http://localhost:3000/d/http-server-projeto-korp"

      - alertname: PrometheusRuleEvaluationFailing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: sre
              job: prometheus
              service: prometheus
              instance: localhost:9090
              rule_group: http-server-projeto-korp.slo
            exp_annotations:
              summary: "prometheus não consegue avaliar o grupo de regras http-server-projeto-korp.slo"
              description: "prometheus_rule_evaluation_failures_total sobe a 0.1000/s há 10 min: recording rules paradas = SLI e burn-rate CONGELADOS, alerta que não dispara. Ver /rules (health != ok)."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#prometheusruleevaluationfailing"
              dashboard_url: "http://localhost:3000/d/http-server-projeto-korp"

      - alertname: AlertmanagerNotificationsFailing
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: sre
              job: alertmanager
              service: alertmanager
              instance: alertmanager:9093
              integration: webhook
            exp_annotations:
              summary: "alertmanager não entrega notificação pela integração webhook"
              description: "alertmanager_notifications_failed_total sobe a 0.1000/s há 10 min: o alerta dispara e NINGUÉM é avisado. Conferir o receiver e a URL do webhook."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#alertmanagernotificationsfailing"
              dashboard_url: "http://localhost:3000/d/http-server-projeto-korp"
      - alertname: PrometheusHeadSeriesHigh
        eval_time: 40m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: sre
              job: prometheus
              service: prometheus
              instance: localhost:9090
            exp_annotations:
              summary: "prometheus acima do orçamento de cardinalidade"
              description: "prometheus_tsdb_head_series = 150000 (orçamento de 100000 séries). Triagem: topk(10, count by (__name__)({__name__=~\".+\"})). Corrigir na origem; metric_relabel_configs é curativo."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#prometheusheadserieshigh"
              dashboard_url: "http://localhost:3000/d/http-server-projeto-korp"

  # ============================================================================================
  # Caso 2 (NEGATIVO): plataforma saudável — nada dispara.
  # ============================================================================================
  - interval: 1m
    input_series:
      - series: 'nginx_connections_accepted{job="nginx",service="nginx",instance="nginx-exporter:9113"}'
        values: '0+60x40'
      - series: 'nginx_connections_handled{job="nginx",service="nginx",instance="nginx-exporter:9113"}'
        values: '0+60x40'
      - series: 'process_open_fds{job="http-server-projeto-korp",service="http-server-projeto-korp",instance="http-server-projeto-korp:8080"}'
        values: '120x40'
      - series: 'process_max_fds{job="http-server-projeto-korp",service="http-server-projeto-korp",instance="http-server-projeto-korp:8080"}'
        values: '1048576x40'
      - series: 'prometheus_config_last_reload_successful{job="prometheus",service="prometheus",instance="localhost:9090"}'
        values: '1x40'
      - series: 'prometheus_rule_evaluation_failures_total{job="prometheus",service="prometheus",instance="localhost:9090",rule_group="http-server-projeto-korp.slo"}'
        values: '0x40'
      - series: 'alertmanager_notifications_failed_total{job="alertmanager",service="alertmanager",instance="alertmanager:9093",integration="webhook"}'
        values: '0x40'
      - series: 'prometheus_tsdb_head_series{job="prometheus",service="prometheus",instance="localhost:9090"}'
        values: '4200x40'
    alert_rule_test:
      - alertname: NginxConnectionsSaturated
        eval_time: 40m
        exp_alerts: []
      - alertname: ProcessFileDescriptorsNearLimit
        eval_time: 40m
        exp_alerts: []
      - alertname: PrometheusConfigReloadFailed
        eval_time: 40m
        exp_alerts: []
      - alertname: PrometheusRuleEvaluationFailing
        eval_time: 40m
        exp_alerts: []
      - alertname: AlertmanagerNotificationsFailing
        eval_time: 40m
        exp_alerts: []
      - alertname: PrometheusHeadSeriesHigh
        eval_time: 40m
        exp_alerts: []

  # ============================================================================================
  # Caso 3 (POSITIVO): disco do host caindo 50 MB a cada 5 min — predict_linear projeta zero
  # dentro de 4 h e já há menos de 30 % livre. `interval: 5m` porque a janela da regra é de 6 h.
  # ============================================================================================
  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",service="node-exporter",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '2000000000-50000000x30'
      - series: 'node_filesystem_size_bytes{job="node",service="node-exporter",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '10000000000x30'
    alert_rule_test:
      - alertname: HostDiskWillFill
        eval_time: 2h                # condição verdadeira desde ~10 min; for: 30m folgado
        exp_alerts:
          - exp_labels:
              severity: warning
              team: sre
              job: node
              service: node-exporter
              instance: node-exporter:9100
              device: /dev/sda1
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "node-exporter: disco de / acaba em menos de 4 h"
              description: "Pela tendência das últimas 6 h, node_filesystem_avail_bytes chega a zero em menos de 4 h em node-exporter:9100 (/dev/sda1), com menos de 30 % livre agora. Disco cheio para o TSDB, o log do Docker e o próprio serviço. Ação: podar imagem/volume, rotacionar log, revisar retention.size."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#hostdiskwillfill"
              dashboard_url: "http://localhost:3000/d/korp-container-health"

  # ============================================================================================
  # Caso 4 (NEGATIVO): disco estável e com folga — a tendência é plana, nada é previsto.
  # ============================================================================================
  - interval: 5m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",service="node-exporter",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '8000000000x30'
      - series: 'node_filesystem_size_bytes{job="node",service="node-exporter",instance="node-exporter:9100",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '10000000000x30'
    alert_rule_test:
      - alertname: HostDiskWillFill
        eval_time: 2h
        exp_alerts: []

  # ============================================================================================
  # Caso 5 (REGRESSÃO): o node-exporter para de entregar node_cpu_seconds_total no minuto 5.
  # Os casos anteriores alimentam séries sintéticas do começo ao fim e por isso passariam idênticos
  # com a coleta do host morta — quem fabrica o dado é o teste. Aqui a série existe em metade da
  # janela e some na outra: prova os dois lados no mesmo cenário, calado com dado e disparando sem.
  # ============================================================================================
  - interval: 1m
    input_series:
      - series: 'node_cpu_seconds_total{job="node",service="node-exporter",instance="node-exporter:9100",cpu="0",mode="idle"}'
        values: '0+60x5'          # amostras só até t=5m; depois a série acaba
    alert_rule_test:
      # t=4m: a série ainda está lá — absent() é vazio e o alerta nem fica pendente
      - alertname: NodeTelemetryMissing
        eval_time: 4m
        exp_alerts: []
      # t=25m: sem amostra desde 5m, o lookback de 5 min expirou em 10m e o `for: 10m` fechou em 20m
      - alertname: NodeTelemetryMissing
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: sre
              service: node-exporter
            exp_annotations:
              summary: "Telemetria de host sumiu: nenhuma série node_cpu_seconds_total armazenada"
              description: "O Prometheus não guarda nenhuma amostra de node_cpu_seconds_total há 10 min. Enquanto durar, HostDiskWillFill está CEGO — avalia vetor vazio e nunca dispara, então disco enchendo passa despercebido. Conferir o alvo `node` em /targets e `curl -s node-exporter:9100/metrics | head`."
              runbook_url: "https://github.com/MWismeck/desafio-projeto-korp/blob/main/docs/runbooks/ALERT_RUNBOOKS.md#nodetelemetrymissing"
              dashboard_url: "http://localhost:3000/d/korp-container-health"
      # sem série de filesystem, HostDiskWillFill fica calado — é essa a cegueira que o alerta acima denuncia
      - alertname: HostDiskWillFill
        eval_time: 25m
        exp_alerts: []
