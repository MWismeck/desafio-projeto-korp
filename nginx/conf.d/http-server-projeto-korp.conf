# Ansible managed
# nginx/conf.d/http-server-projeto-korp.conf — proxy reverso:80 -> http-server-projeto-korp:8080
# Fonte: ansible/roles/nginx/templates/http-server-projeto-korp.conf.j2

log_format korp_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,'
  '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time","http_user_agent":"$http_user_agent",'
  '"x_forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name _;
    server_tokens off;

    # DNS interno do Docker, consultado a cada 10s no máximo. Sem um resolver o NGINX traduz o nome
    # do container em IP uma única vez, ao carregar a configuração, e usa esse IP até o próximo
    # reload. Quando o app é recriado ele volta com outro IP — e o IP antigo pode já ter sido
    # reaproveitado por outro container da mesma rede, que passa a receber o tráfego do usuário sem
    # que nada fique vermelho: o app responde, o proxy responde, só que um ao outro não.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout korp_json;
    error_log  /dev/stderr warn;

    client_max_body_size 1m;
    client_header_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /metrics { return 404; }
    location ^~ /debug/ { return 404; }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # O destino fica numa variável de propósito: é a variável que obriga o NGINX a resolver o
        # nome em tempo de requisição, pelo resolver acima, em vez de congelar o IP na carga. Como o
        # valor não traz caminho algum, a URI original segue intacta para o app (/projeto-korp
        # chega como /projeto-korp, /swagger/ como /swagger/).
        set $korp_upstream http://http-server-projeto-korp:8080;
        proxy_pass $korp_upstream;
        # O preço da resolução dinâmica é o pool de conexões persistentes: o NGINX OSS só reaproveita
        # conexões declaradas num bloco `upstream`, e nomes declarados lá nunca são re-resolvidos.
        # Para o volume deste serviço, acertar o container vale mais que poupar o handshake.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
