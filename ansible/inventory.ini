# ansible/inventory.ini — alvo do provisionamento
# Execução local (WSL2 Ubuntu ou VM onde o repositório está clonado):
[local]
localhost ansible_connection=local

# Host remoto (exemplo): descomente e ajuste usuário/chave. Nenhuma role copia o repositório para o
# alvo: o build da imagem e o `docker compose` acontecem em `project_root`, que precisa JÁ existir
# no alvo — no mesmo caminho absoluto do controlador ou informado com `-e project_root=/caminho`.
# [remote]
# korp-vm ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[all:vars]
ansible_python_interpreter=auto_silent
