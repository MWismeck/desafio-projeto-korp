# roles/nginx/defaults/main.yml — variáveis sobrescrevíveis da role nginx.
# `project_root` e `compose_profiles` vêm de ansible/group_vars/all.yml (variáveis do playbook).
---
nginx_container_name: nginx
nginx_conf_dir: "{{ project_root }}/nginx/conf.d"
# Mesma tag do serviço nginx no compose.yml — usada só para validar a configuração antes de aplicá-la.
nginx_image: nginx:1.27-alpine
# A validação roda dentro da korp-net por precaução, não por necessidade: desde que o proxy_pass
# passou a usar variável com `resolver`, o nome do upstream é resolvido em tempo de REQUISIÇÃO, e
# `nginx -t` passa mesmo fora da rede. Manter a rede aqui garante que o teste exercite o mesmo
# ambiente de execução, e não custa nada.
nginx_network: korp-net
# Arquivo canônico do proxy reverso: o nome NÃO muda e o conteúdo é gerado do template.
nginx_site_conf: http-server-projeto-korp.conf
# Server interno na 8081 com `stub_status`, lido pelo nginx-exporter do perfil `full`.
# Fica no mesmo diretório porque o compose monta ./nginx/conf.d inteiro em /etc/nginx/conf.d.
nginx_stub_status_conf: stub_status.conf
nginx_stub_status_port: 8081
nginx_profile_full: "{{ 'full' in (compose_profiles | default) }}"
