# Roteamento de alerta por severidade e por time.
# Profile `full` do compose. Validar: amtool check-config alertmanager.yml.
#
# ENTREGA: nenhum receiver tem integração ativa. Enquanto for assim, o Alertmanager agrupa,
# inibe e roteia — mas não notifica ninguém. É deliberado, e é melhor do que a alternativa
# anterior (apontar para o webhook de exemplo http://localhost:5001/, onde nada escuta): lá
# 100% das notificações falhavam, e o alerta que existe justamente para denunciar essa falha
# (AlertmanagerNotificationsFailing, severity=critical) era roteado para o mesmo canal morto —
# o aviso morria dentro do problema que ele deveria anunciar. Um receiver sem integração é
# válido e simplesmente não tenta notificar: não falha, e não alimenta esse laço.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity = critical]
      receiver: oncall-page
      group_wait: 10s
      repeat_interval: 1h
    - matchers: [severity = warning]
      receiver: oncall-ticket
      repeat_interval: 12h
    - matchers: [severity = info]
      receiver: default

receivers:
  # Nenhum receiver tem integração ativa: sem isso o Alertmanager não tenta notificar e, por
  # consequência, não falha. Para ligar a entrega, descomente o bloco e traga o segredo de variável
  # de ambiente ou de um cofre — o valor real nunca entra neste arquivo, que é versionado.
  - name: default
  #   slack_configs:
  #     - api_url: ${SLACK_WEBHOOK_URL}
  #       channel: "#korp-alertas"
  #       send_resolved: true

  - name: oncall-page
  #   slack_configs:
  #     - api_url: ${SLACK_WEBHOOK_URL}
  #       channel: "#korp-oncall"
  #       send_resolved: true
  #       title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
  #       text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: oncall-ticket
  #   telegram_configs:
  #     - bot_token: ${TELEGRAM_BOT_TOKEN}
  #       chat_id: ${TELEGRAM_CHAT_ID}
  #       parse_mode: HTML
  #       send_resolved: true
  #       message: '<b>{{ .CommonLabels.alertname }}</b> — {{ .CommonLabels.service }}'

inhibit_rules:
  # critical inibe warning do mesmo alerta/serviço (burn-rate rápido já cobre o lento)
  - source_matchers: [severity = critical]
    target_matchers: [severity = warning]
    equal: [alertname, service]
  # sem scrape (TargetDown) inibe os alertas derivados do serviço
  - source_matchers: [alertname = TargetDown]
    target_matchers: [alertname =~ "Service.*"]
    equal: [service]
  # 2026-09-06 — a violação de contrato EXPLICA a falha da sonda no mesmo alvo:
  # ServiceContractViolated e UserPathUnavailable disparam juntos (probe_success = 0 nos dois casos);
  # o on-call precisa de UM page, o mais específico.
  - source_matchers: [alertname = ServiceContractViolated]
    target_matchers: [alertname = UserPathUnavailable]
    equal: [service, instance]
  # 2026-09-06 — o OOM explica o reinício em laço, o container sumido e o headroom baixo.
  # `service` nos alertas de container é o NOME DO CONTAINER (label_replace em container.rules.yml),
  # por isso o `equal` funciona entre as duas famílias.
  - source_matchers: [alertname = ContainerOOMKilled]
    target_matchers: [alertname =~ "ContainerRestartLoop|ServiceRestartLoop|ContainerMissing|ContainerMemoryNearLimit"]
    equal: [service]
