; ansible/ansible.cfg — configuração do projeto.
;
; COMO ESTE ARQUIVO É CARREGADO: o Ansible procura o ansible.cfg em $ANSIBLE_CONFIG, no diretório
; ATUAL, em ~/.ansible.cfg e em /etc/ansible/ansible.cfg — nunca ao lado do playbook. Como o comando
; único roda a partir da raiz do repositório, sem $ANSIBLE_CONFIG o `ansible --version` mostra
; `config file = None` e nada daqui vale. Por isso o Makefile exporta a variável; ao chamar o
; playbook na mão, faça o mesmo:
;   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
; Os caminhos relativos abaixo são resolvidos a partir DESTA pasta, não do diretório atual.
[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
; Saída legível task a task. O callback `yaml` vinha da community.general e foi REMOVIDO; pedi-lo aqui
; aborta o `ansible-playbook` antes da primeira task. Desde o ansible-core 2.13 o mesmo formato sai do
; callback padrão com `callback_result_format`.
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
gathering = smart
gather_subset = !all,!min,network,virtual,distribution
forks = 10
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
