# ansible/inventory.ini — alvo do provisionamento
# Execução local (WSL2 Ubuntu ou VM onde o repositório está clonado):
[local]
localhost ansible_connection=local

# Host remoto (exemplo): descomente e ajuste usuário/chave; o repositório é copiado pela role app.
# [remote]
# korp-vm ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[all:vars]
ansible_python_interpreter=auto_silent
