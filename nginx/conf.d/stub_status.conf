# nginx/conf.d/stub_status.conf — endpoint interno de métricas do NGINX para o nginx-prometheus-exporter.
#
# NÃO altera http-server-projeto-korp.conf: é um server block adicional, em arquivo separado.
# Validar: docker run --rm -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t
#
# POR QUE uma porta separada (8081) e não uma location na 80:
#   a 80 é a única porta publicada no host; qualquer coisa servida ali é internet-facing.
#   A 8081 fica só em `expose:` — alcançável apenas de dentro da rede korp-net.
# POR QUE NÃO `allow 127.0.0.1; deny all;`:
#   o nginx-exporter roda em OUTRO container; o IP de origem é o do container dele na bridge korp-net
#   (172.x.y.z), não loopback — a lista de allow bloquearia justamente o consumidor legítimo.
#   O controle de acesso aqui é topológico: porta não publicada + tudo que não for /stub_status = 404.

server {
    listen 8081;
    server_name _;
    server_tokens off;

    # ruído zero: o exporter raspa a cada 15 s; um access_log por scrape não diz nada.
    access_log off;
    error_log  /dev/stderr warn;

    # stub_status expõe: active connections, accepts/handled/requests, reading/writing/waiting.
    # É o insumo de Utilization/Saturation (USE) do proxy — complementa o RED do app.
    location = /stub_status {
        stub_status;
    }

    # superfície mínima: nada mais existe nesta porta.
    location / {
        return 404;
    }
}
