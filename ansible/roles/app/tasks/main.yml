# roles/app/tasks/main.yml — build da imagem e docker compose up. Idempotente:
# docker_image só reconstrói quando os fontes mudam (checksum), docker_compose_v2 mantém state=present.
---
- name: Verificar que o repositório tem Dockerfile e compose.yml
  ansible.builtin.stat:
    path: "{{ project_root }}/{{ item }}"
  loop: [Dockerfile, compose.yml, go.mod]
  register: app_files

- name: Falhar cedo se faltar arquivo essencial
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: "{{ item.item }} não encontrado em {{ project_root }}"
  loop: "{{ app_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Calcular checksum dos fontes Go (decide se a imagem precisa ser reconstruída)
  ansible.builtin.find:
    paths: "{{ project_root }}"
    patterns: ["*.go", "go.mod", "go.sum", "Dockerfile"]
    recurse: true
    excludes: [".git", "vendor"]
    get_checksum: true
  register: app_sources

# Hash de `path:checksum`, e nao do caminho sozinho: hashear so o caminho devolvia o MESMO valor
# depois de editar um .go, entao `rebuild: never` preservava a imagem antiga e o ambiente passava a
# servir codigo velho sem nenhum sinal. O par pega as tres mudancas que exigem rebuild: conteudo,
# arquivo novo/removido e renomeacao.
- name: Consolidar checksum dos fontes
  ansible.builtin.set_fact:
    app_sources_hash: >-
      {{ (app_sources.files | sort(attribute='path') | map(attribute='path') | list)
         | zip(app_sources.files | sort(attribute='path') | map(attribute='checksum') | list)
         | map('join', ':') | join('|') | hash('sha1') }}

# docker_image_build e NAO docker_image: o primeiro chama `docker buildx`, o segundo constroi pela API
# antiga do daemon, que nao entende `RUN --mount=type=cache` do Dockerfile e falha com "the --mount
# option requires BuildKit". Verificado em Ubuntu 24.04 (WSL2) em 2026-09-08.
#
# Sem `check_mode: false` de proposito: com ele, `--check` construia a imagem de verdade, e o ensaio
# que se anuncia inofensivo virava uma execucao real de varios minutos. Nada mais no playbook consome
# a imagem durante um ensaio (compose, promtool e validate tambem nao agem em modo check).
- name: Construir a imagem http-server-projeto-korp
  community.docker.docker_image_build:
    name: "{{ app_name }}"
    tag: "{{ app_version }}"
    path: "{{ project_root }}"
    dockerfile: Dockerfile
    args:
      VERSION: "{{ app_version }}"
      COMMIT: "{{ app_commit }}"
    pull: false
    # rebuild: reconstrói só quando o checksum dos fontes difere do registrado (idempotência controlada)
    rebuild: >-
      {{ 'always'
         if app_sources_hash != (lookup('ansible.builtin.file',
            project_root ~ '/.ansible/sources-hash',
            errors='ignore') | default(''))
         else 'never' }}

- name: Registrar o checksum dos fontes usados no build
  ansible.builtin.copy:
    content: "{{ app_sources_hash }}"
    dest: "{{ project_root }}/.ansible/sources-hash"
    mode: "0644"

- name: Subir os containers com docker compose (perfil ativo em compose_profiles)
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    files: [compose.yml]
    profiles: "{{ compose_profiles }}"
    state: present
    wait: true
    wait_timeout: 120
    build: never
  environment:
    VERSION: "{{ app_version }}"
    COMMIT: "{{ app_commit }}"
  register: app_compose_up

- name: Exibir containers gerenciados pelo compose
  ansible.builtin.debug:
    msg: "{{ app_compose_up.containers | default | map(attribute='Name') | list }}"
