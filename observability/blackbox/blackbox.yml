# observability/blackbox/blackbox.yml — Prometheus Blackbox Exporter (profile `full`).
# Papel: prova de disponibilidade vista DE FORA. Complementa: `service_up` é auto-declaração,
# `/healthz` é probe local e `up` é a visão do scrape — nenhum dos três prova que o contrato do
#  continua sendo cumprido através do NGINX, do ponto de vista de um cliente.
#

modules:
  # ------------------------------------------------------------------------------------------------
  # korp_contract — testa o CONTRATO, não apenas o código 200.
  # POR QUE checar o corpo: um proxy mal configurado, uma página do NGINX ou um handler que devolve
  # {} respondem 200 e passariam num probe ingênuo. O  exige o campo "nome" com o valor
  # "Projeto Korp"; é isso que este módulo verifica — assim `probe_success` vira SLI de contrato.
  # Alvo esperado (definido em observability/prometheus/prometheus.yml, de outro dono):
  #   http://nginx:80/projeto-korp — o caminho público real, atravessando o proxy reverso.
  # ------------------------------------------------------------------------------------------------
  korp_contract:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false # korp-net é IPv4; fallback só mascararia erro de DNS
      follow_redirects: false # o endpoint responde direto; um 30x aqui é defeito, não sucesso
      fail_if_not_ssl: false # sem TLS no escopo do desafio (DEBT-05)
      # {"nome":"Projeto Korp","horario":"..."} — tolerante ao espaçamento do encoder.
      fail_if_body_not_matches_regexp:
        - '"nome"[[:space:]]*:[[:space:]]*"Projeto Korp"'
      # a resposta é JSON. Corpo certo com Content-Type errado continua sendo defeito.
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: "^application/json"
      headers:
        User-Agent: blackbox-exporter/korp

  # ------------------------------------------------------------------------------------------------
  # icmp — alcance de camada 3 (o alvo responde?). Útil para separar "app quebrado" de "host sumiu".
  # ATENÇÃO OPERACIONAL: o prober ICMP abre socket raw. Como o compose usa `cap_drop: [ALL]`, o
  # serviço blackbox-exporter precisa de `cap_add: [NET_RAW]` — sem isso ESTE módulo falha com
  # "permission denied" enquanto o módulo HTTP continua funcionando (falha parcial, difícil de achar).
  # ------------------------------------------------------------------------------------------------
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
