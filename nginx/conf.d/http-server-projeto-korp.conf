# nginx/conf.d/http-server-projeto-korp.conf — proxy reverso:80 → http-server-projeto-korp:8080
#
# Validar: docker run --rm -v "$PWD/nginx/conf.d:/etc/nginx/conf.d:ro" nginx:1.27-alpine nginx -t

log_format korp_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,'
  '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time","http_user_agent":"$http_user_agent",'
  '"x_forwarded_for":"$http_x_forwarded_for"}';

upstream korp_app {
    # nome DNS do serviço do compose na rede korp-net
    server http-server-projeto-korp:8080;
    keepalive 16;
}

server {
    listen 80;                                  # única porta publicada no host
    server_name _;
    server_tokens off;

    access_log /dev/stdout korp_json;
    error_log  /dev/stderr warn;

    client_max_body_size 1m;
    client_header_timeout 10s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # diagnósticos do app nunca saem pelo proxy
    location = /metrics { return 404; }
    location ^~ /debug/ { return 404; }

    # healthcheck do próprio nginx (compose)
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Documentação da API: a UI do Swagger é servida pelo próprio app; aqui só passa.
    location /swagger/ {
        proxy_pass http://korp_app;
    }

    location / {
        proxy_pass http://korp_app;             # http-server-projeto-korp:8080
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Produção (fora do escopo do brief): TLS
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
