basePath: /
definitions:
  handler.ProjetoKorpResponse:
    properties:
      horario:
        example: "2026-09-07T12:00:00Z"
        type: string
      nome:
        example: Projeto Korp
        type: string
    type: object
  problem.Problem:
    properties:
      detail:
        example: no route for GET /x
        type: string
      instance:
        example: /x
        type: string
      request_id:
        example: 7f2c1a1e-3b0e-4d8f-9a44-1d2f0c3b6a90
        type: string
      status:
        example: 404
        type: integer
      title:
        example: Not Found
        type: string
      type:
        example: about:blank
        type: string
    type: object
info:
  contact: {}
  description: 'Serviço HTTP do Desafio DevOps "Projeto Korp": GET /projeto-korp devolve
    o nome do projeto e o horário atual em UTC, resolvido a cada requisição.'
  title: http-server-projeto-korp
  version: 1.0.0
paths:
  /projeto-korp:
    get:
      description: Returns the project name and the current time in UTC (RFC 3339),
        resolved on every request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Request-ID:
              description: Correlation id, echoed from the request or generated
              type: string
          schema:
            $ref: '#/definitions/handler.ProjetoKorpResponse'
        "405":
          description: 'Method not allowed (Allow: GET, HEAD)'
          schema:
            $ref: '#/definitions/problem.Problem'
      summary: Project name and current UTC time
      tags:
      - projeto-korp
swagger: "2.0"
