# observability/grafana/provisioning/datasources/datasources.yml — bônus: Grafana provisionado por arquivo.
#
# Datasource do perfil PADRÃO da entrega: só o Prometheus, origem de TODAS as métricas dos dashboards
# versionados. Eles a referenciam por ${DS_PROMETHEUS}, que resolve para a datasource padrão do org —
# por isso o `isDefault: true` abaixo não é cosmético.
#
# Regras que este arquivo cumpre:
#   - uid fixo (`prometheus`): o JSON do dashboard não pode depender de um id sorteado no primeiro boot.
#   - access: proxy — o browser fala com o Grafana; o Grafana fala com o serviço pelo nome DNS na korp-net.
#   - editable: false — mudança de datasource é PR, não clique na UI.
#   - NENHUM segredo literal: o Grafana expande $VAR/${VAR} a partir do ambiente do container, então
#     credencial entra por variável de ambiente. Ao acrescentar aqui qualquer "$" que pertença a uma
#     EXPRESSÃO (PromQL, $__rate_interval), escreva "$$" — senão o provisioning tenta expandir como env.
#
# A datasource do Alertmanager mora em `datasources_full.yml.disabled`: o container `alertmanager` só
# existe no perfil estendido e, fora dele, uma datasource apontando para host inexistente aparece
# quebrada na UI. Mesmo interruptor do `scrape_full.yml` — ver o cabeçalho daquele arquivo.
apiVersion: 1

# Renomeou/aposentou uma datasource? Declare aqui — o provisioning não remove sozinho.
deleteDatasources: []

datasources:
  # --------------------------------------------------------------------------------------- MÉTRICAS
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true            # a datasource padrão do org: ${DS_PROMETHEUS} resolve para ela
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s        # = scrape_interval; base de $__rate_interval
      manageAlerts: false      # alertas vivem só no Prometheus/Alertmanager
      prometheusType: Prometheus
      prometheusVersion: "3.5.0"
      incrementalQuerying: true
