# observability/blackbox/blackbox.yml — Prometheus Blackbox Exporter (profile `full`).
# Papel: prova de disponibilidade vista DE FORA. Complementa: `service_up` é auto-declaração,
# `/healthz` é probe local e `up` é a visão do scrape — nenhum dos três prova que o contrato
# da API continua sendo cumprido através do NGINX, do ponto de vista de um cliente.
#

modules:
  # ------------------------------------------------------------------------------------------------
  # korp_contract — testa o CONTRATO, não apenas o código 200.
  # POR QUE checar o corpo: um proxy mal configurado, uma página do NGINX ou um handler que devolve
  # {} respondem 200 e passariam num probe ingênuo. O desafio exige o campo "nome" com o valor
  # "Projeto Korp"; é isso que este módulo verifica — assim `probe_success` vira SLI de contrato.
  # Alvo esperado (definido em observability/prometheus/prometheus.yml, de outro dono):
  #   http://nginx:80/projeto-korp — o caminho público real, atravessando o proxy reverso.
  # ------------------------------------------------------------------------------------------------
  korp_contract:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false # korp-net é IPv4; fallback só mascararia erro de DNS
      follow_redirects: false # o endpoint responde direto; um 30x aqui é defeito, não sucesso
      fail_if_not_ssl: false # sem TLS no escopo do desafio
      # {"nome":"Projeto Korp","horario":"..."} — tolerante ao espaçamento do encoder.
      fail_if_body_not_matches_regexp:
        - '"nome"[[:space:]]*:[[:space:]]*"Projeto Korp"'
      # a resposta é JSON. Corpo certo com Content-Type errado continua sendo defeito.
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: "^application/json"
      headers:
        User-Agent: blackbox-exporter/korp

  # ------------------------------------------------------------------------------------------------
  # korp_liveness — o /healthz através do NGINX. Não reaproveita a regex do korp_contract porque
  # /healthz não devolve o JSON do contrato: aplicá-la aqui reprova a sonda 100 % do tempo. Foi o que
  # aconteceu até 2026-09-09, com `probe_success{probe="liveness"}` preso em 0 e UserPathUnavailable e
  # ServiceContractViolated disparando para sempre no perfil `full`.
  # POR QUE ainda assim checar o corpo: sem checagem nenhuma a sonda aceita QUALQUER 200 e passa a
  # medir "alguém respondeu", não "o serviço respondeu". Aconteceu de o upstream do NGINX resolver
  # para o cAdvisor (que também escuta na 8080 dentro da korp-net) e a sonda ficar verde com o
  # serviço real inalcançável — os 2 bytes de `ok` do cAdvisor passavam no lugar dos 16 bytes de
  # {"status":"ok"} do app. As duas checagens abaixo são o menor par que só o app satisfaz.
  # ------------------------------------------------------------------------------------------------
  korp_liveness:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      follow_redirects: false
      fail_if_not_ssl: false
      # {"status":"ok"} do handler de liveness — tolerante ao espaçamento do encoder.
      fail_if_body_not_matches_regexp:
        - '"status"[[:space:]]*:[[:space:]]*"ok"'
      # o handler declara JSON; um `ok` em text/plain vem de outro processo, não deste serviço.
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: "^application/json"
      headers:
        User-Agent: blackbox-exporter/korp

  # ------------------------------------------------------------------------------------------------
  # icmp — alcance de camada 3 (o alvo responde?). Útil para separar "app quebrado" de "host sumiu".
  # ATENÇÃO OPERACIONAL: o prober ICMP abre socket raw. Como o compose usa `cap_drop: [ALL]`, o
  # serviço blackbox-exporter precisa de `cap_add: [NET_RAW]` — sem isso ESTE módulo falha com
  # "permission denied" enquanto o módulo HTTP continua funcionando (falha parcial, difícil de achar).
  # ------------------------------------------------------------------------------------------------
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
