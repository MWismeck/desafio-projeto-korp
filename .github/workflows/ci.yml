# .github/workflows/ci.yml — pipeline do http-server-projeto-korp.
#
# Cada job chama a ferramenta diretamente, para que qualquer pessoa leia o YAML e entenda o que é
# verificado sem depender de scripts locais. O CI é confirmação: os mesmos checks rodam antes do commit.
#
# Versões: ferramentas Go via `go install @versão`; o resto via imagem Docker com tag fixa
# (o runner ubuntu-latest já tem Docker). Actions pinadas por SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # GOTOOLCHAIN=local proibe o Go de baixar outra toolchain: o que setup-go instalar e o que roda,
  # sem surpresa de rede. Por isso a versao abaixo tem de ser a MESMA da linha `toolchain` do
  # go.mod — e nao a da linha `go`, que e so o minimo da linguagem. Ao subir uma, subir a outra.
  GOTOOLCHAIN: local
  GO_VERSION: '1.25.14'

jobs:
  go:
    name: Go — build, lint, testes, swagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Ferramentas
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          # versao fixada, e nao @latest: a v1.8.0 exige Go >= 1.26 para compilar, e este job roda com
          # GOTOOLCHAIN=local, ou seja, a toolchain declarada no go.mod (1.25) — com @latest o passo
          # falha na INSTALACAO, antes de analisar uma linha. A v1.7.0 e a ultima que compila com 1.25.
          # Nao voltar mais: a v1.1.4 instala, mas foi compilada com Go 1.24 e recusa analisar
          # pacotes 1.25 ("package requires newer Go version"). Ao subir a toolchain, subir este pin.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Build estático (é o binário que vai para a imagem)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Testes com detector de corrida e cobertura
        run: |
          go test -race -shuffle=on -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: gosec
        run: gosec -quiet ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: Swagger gerado está em dia com o código
        run: |
          swag init -g cmd/http-server-projeto-korp/main.go -o api --packageName api --parseInternal
          git diff --exit-code -- api/ || {
            echo "::error::api/ desatualizada — rode 'make swagger' e versione o resultado"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  security:
    name: Segurança — segredos e vulnerabilidades do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks varre o histórico

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

      - name: trivy (sistema de arquivos — dependências e configs)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.0 \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress /src

      # As duas verificações abaixo não são de ferramenta: são regras deste projeto que nenhuma das
      # anteriores cobre. O gitleaks encontra segredo pelo FORMATO do valor; um `.env` versionado com
      # `APP_ENV=local` não casa com padrão nenhum e passaria limpo — mas o arquivo não pode existir no
      # histórico, porque é nele que a senha vai parar no dia em que alguém copiar o `.env.example`.
      - name: .env nunca versionado (só .env.example)
        run: |
          hits="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$hits" ]; then
            echo "::error::.env versionado no git: $hits — versione apenas .env.example"
            exit 1
          fi

      # O gosec sinaliza pprof IMPORTADO, não pprof EXPOSTO. Importar net/http/pprof registra os
      # handlers no DefaultServeMux por efeito colateral do init; servir esse mux numa porta pública
      # entrega heap, goroutines e profile de CPU a qualquer cliente. O serviço usa mux próprio
      # (internal/server), e esta asserção existe para impedir a regressão silenciosa.
      - name: pprof/expvar fora do mux público
        run: |
          if grep -rqE '"net/http/pprof"|"expvar"' --include='*.go' --exclude='*_test.go' . \
            && grep -rqE 'ListenAndServe\("?:[0-9]+"?,[[:space:]]*nil\)' --include='*.go' .; then
            echo "::error::pprof/expvar registrados no DefaultServeMux servido publicamente — use listener interno"
            exit 1
          fi

  docker:
    name: Docker — imagem, compose e smoke pela porta 80
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:2.12.0 < Dockerfile

      - name: docker build
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" --build-arg COMMIT="${GITHUB_SHA::7}" -t http-server-projeto-korp:ci .

      - name: trivy (imagem)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress http-server-projeto-korp:ci

      - name: compose válido nos dois perfis
        run: |
          docker compose config -q
          docker compose --profile full config -q

      - name: Smoke — sobe o ambiente e chama o serviço pelo NGINX
        run: |
          cp .env.example .env
          # korp-net e external: true no compose: quem cria e a role network do Ansible ou o alvo up
          # do Makefile. Sem isto o compose recusa subir (network korp-net declared as external).
          docker network inspect korp-net >/dev/null 2>&1 || docker network create --driver bridge korp-net
          VERSION=ci docker compose up -d --wait --wait-timeout 90
          docker compose ps
          body="$(curl -fsS http://localhost/projeto-korp)"
          echo "$body"
          echo "$body" | docker run --rm -i ghcr.io/jqlang/jq:1.7.1 -e '.nome == "Projeto Korp" and (.horario | length) > 0' >/dev/null
          curl -fsS http://localhost/swagger/index.html >/dev/null
          curl -fsS http://localhost:9090/-/ready
          # O alvo do servico precisa estar UP no Prometheus. activeTargets[] COM os colchetes: sem
          # eles o filtro roda sobre o ARRAY inteiro, nunca casa, e a espera terminava em silencio,
          # dando o smoke por bom. Por isso tambem o ok: laco que esgota tem de reprovar.
          ok=0
          for _ in $(seq 1 12); do
            if curl -s http://localhost:9090/api/v1/targets \
              | docker run --rm -i ghcr.io/jqlang/jq:1.7.1 -e '.data.activeTargets[] | select(.labels.job=="http-server-projeto-korp") | select(.health=="up")' >/dev/null; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "::error::alvo http-server-projeto-korp nao ficou UP no Prometheus"; exit 1; fi

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Derruba o stack
        if: always()
        run: |
          docker compose --profile full down -v --remove-orphans
          docker network rm korp-net 2>/dev/null || true

  observability:
    name: Observabilidade — regras, alertas, dashboards e configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: promtool — config, regras (lint estrito) e testes unitários
        run: |
          P="$PWD/observability/prometheus"
          # O glob precisa ser expandido DENTRO do container: /cfg so existe la. Passado direto ao
          # promtool, o shell do runner tenta expandir /cfg/rules/*.rules.yml contra o proprio disco,
          # nao encontra nada, entrega o padrao literal e o promtool morre com "path does not exist".
          # Por isso --entrypoint sh -c em vez de --entrypoint promtool.
          run_promtool() {
            docker run --rm -v "$P:/cfg:ro" --entrypoint sh prom/prometheus:v3.5.0 -c "$1"
          }
          run_promtool 'promtool check config /cfg/prometheus.yml'
          run_promtool 'promtool check rules --lint=all --lint-fatal /cfg/rules/*.rules.yml'
          run_promtool 'promtool test rules /cfg/rules/tests/*.test.yml'

      - name: amtool — alertmanager.yml
        run: docker run --rm -v "$PWD/observability/alertmanager:/cfg:ro" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml

      - name: blackbox — config.check
        run: docker run --rm -v "$PWD/observability/blackbox:/cfg:ro" prom/blackbox-exporter:v0.25.0 --config.file=/cfg/blackbox.yml --config.check

      - name: Dashboards e provisioning do Grafana fazem parse
        run: |
          for f in observability/grafana/dashboards/*.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('observability/grafana/provisioning/**/*.yml', recursive=True)]; print('provisioning ok')"

  ansible:
    name: Ansible — lint e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ansible-core, ansible-lint, yamllint
        run: |
          python3 -m pip install --user "ansible-core>=2.17,<2.20" "ansible-lint>=24.12" yamllint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint ansible/ observability/ compose.yml

      - name: ansible-lint (perfil production)
        run: ansible-lint --profile production ansible/playbook.yml

      - name: syntax-check do comando único de provisionamento
        run: ansible-playbook -i ansible/inventory.ini --syntax-check ansible/playbook.yml

  workflows:
    name: Workflows — actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
