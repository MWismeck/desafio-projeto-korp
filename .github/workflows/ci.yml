# .github/workflows/ci.yml — pipeline do http-server-projeto-korp.
#
# Cada job chama a ferramenta diretamente, para que qualquer pessoa leia o YAML e entenda o que é
# verificado sem depender de scripts locais. O CI é confirmação: os mesmos checks rodam antes do commit.
#
# Versões: ferramentas Go via `go install @versão`; o resto via imagem Docker com tag fixa
# (o runner ubuntu-latest já tem Docker). Actions pinadas por SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go — build, lint, testes, swagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Ferramentas
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/swaggo/swag/cmd/swag@v1.16.4

      - name: Build estático (é o binário que vai para a imagem)
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath ./...

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: Testes com detector de corrida e cobertura
        run: |
          go test -race -shuffle=on -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

      - name: gosec
        run: gosec -quiet ./...

      - name: govulncheck
        run: govulncheck ./...

      - name: Swagger gerado está em dia com o código
        run: |
          swag init -g cmd/http-server-projeto-korp/main.go -o api --packageName api --parseInternal
          git diff --exit-code -- api/ || {
            echo "::error::api/ desatualizada — rode 'make swagger' e versione o resultado"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  security:
    name: Segurança — segredos e vulnerabilidades do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # gitleaks varre o histórico

      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact

      - name: trivy (sistema de arquivos — dependências e configs)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.0 \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress /src

  docker:
    name: Docker — imagem, compose e smoke pela porta 80
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint:2.12.0 < Dockerfile

      - name: docker build
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" --build-arg COMMIT="${GITHUB_SHA::7}" -t http-server-projeto-korp:ci .

      - name: trivy (imagem)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress http-server-projeto-korp:ci

      - name: compose válido nos dois perfis
        run: |
          docker compose config -q
          docker compose --profile full config -q

      - name: Smoke — sobe o ambiente e chama o serviço pelo NGINX
        run: |
          cp.env.example.env
          VERSION=ci docker compose up -d --wait --wait-timeout 90
          docker compose ps
          body="$(curl -fsS http://localhost/projeto-korp)"
          echo "$body"
          echo "$body" | docker run --rm -i ghcr.io/jqlang/jq:1.7.1 -e '.nome == "Projeto Korp" and (.horario | length) > 0' >/dev/null
          curl -fsS http://localhost/swagger/index.html >/dev/null
          curl -fsS http://localhost:9090/-/ready
          # o alvo do serviço precisa estar UP no Prometheus
          for _ in $(seq 1 12); do
            curl -s http://localhost:9090/api/v1/targets \
              | docker run --rm -i ghcr.io/jqlang/jq:1.7.1 -e '.data.activeTargets | select(.labels.job=="http-server-projeto-korp") | select(.health=="up")' >/dev/null && break
            sleep 5
          done

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Derruba o stack
        if: always()
        run: docker compose --profile full down -v --remove-orphans

  observability:
    name: Observabilidade — regras, alertas, dashboards e configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: promtool — config, regras (lint estrito) e testes unitários
        run: |
          P="$PWD/observability/prometheus"
          docker run --rm -v "$P:/cfg:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /cfg/prometheus.yml
          docker run --rm -v "$P:/cfg:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules --lint=all --lint-fatal /cfg/rules/*.rules.yml
          docker run --rm -v "$P:/cfg:ro" --entrypoint promtool prom/prometheus:v3.5.0 test rules /cfg/rules/tests/*.test.yml

      - name: amtool — alertmanager.yml
        run: docker run --rm -v "$PWD/observability/alertmanager:/cfg:ro" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml

      - name: blackbox e OTel Collector
        run: |
          docker run --rm -v "$PWD/observability/blackbox:/cfg:ro" prom/blackbox-exporter:v0.25.0 --config.file=/cfg/blackbox.yml --config.check
          docker run --rm -v "$PWD/observability/otel:/cfg:ro" otel/opentelemetry-collector-contrib:0.113.0 validate --config=/cfg/otel-collector.yaml

      - name: Dashboards e provisioning do Grafana fazem parse
        run: |
          for f in observability/grafana/dashboards/*.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('observability/grafana/provisioning/**/*.yml', recursive=True)]; print('provisioning ok')"

  ansible:
    name: Ansible — lint e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: ansible-core, ansible-lint, yamllint
        run: |
          python3 -m pip install --user "ansible-core>=2.17,<2.20" "ansible-lint>=24.12" yamllint
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint ansible/ observability/ compose.yml

      - name: ansible-lint (perfil production)
        run: ansible-lint --profile production ansible/playbook.yml

      - name: syntax-check do comando único de provisionamento
        run: ansible-playbook -i ansible/inventory.ini --syntax-check ansible/playbook.yml

  workflows:
    name: Workflows — actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
