# roles/monitoring/defaults/main.yml — variáveis sobrescrevíveis da role de monitoramento
# .
#
# `project_root` e `compose_profiles` são variáveis do PLAYBOOK (quatro roles as leem) e moram em
# ansible/group_vars/all.yml — não são redefinidas aqui para não criar duas fontes de verdade.
---
monitoring_prometheus_dir: "{{ project_root }}/observability/prometheus"
monitoring_grafana_dir: "{{ project_root }}/observability/grafana"

# Perfil estendido da demo: `-e compose_profiles='["full"]'`.
monitoring_profile_full: "{{ 'full' in (compose_profiles | default) }}"

# Imagem oficial usada para rodar promtool sem instalar nada no alvo (mesma tag do compose.yml).
# mesma versao do servidor no compose
monitoring_promtool_image: prom/prometheus:v3.5.0

# Endpoints publicados no host pelo perfil PADRÃO do compose (só estes dois têm `ports:`).
monitoring_prometheus_url: http://localhost:9090
monitoring_grafana_url: http://localhost:3000

# Arquivo de scrape do perfil `full` (nginx, blackbox, cAdvisor, node, Grafana, Alertmanager).
# O `prometheus.yml` o carrega pelo glob
# `scrape_config_files: [scrape_*.yml]`; o sufixo `.disabled` NÃO casa o glob, então renomear é o
# interruptor. Ver a explicação completa em tasks/main.yml.
monitoring_scrape_full: "{{ monitoring_prometheus_dir }}/scrape_full.yml"
monitoring_scrape_full_disabled: "{{ monitoring_prometheus_dir }}/scrape_full.yml.disabled"

# Paineis que leem exporters do perfil estendido. No perfil padrao esses containers nao existem e o
# painel abriria em branco na frente de quem avalia — parece defeito e nao e. Mesmo interruptor do
# scrape: o versionado e o `.disabled`, e o perfil decide se vira `.json`.
monitoring_dashboards_dir: "{{ project_root }}/observability/grafana/dashboards"
monitoring_dashboards_full:
  - korp-edge.json
  - korp-container-health.json

# Configuração exigida no perfil PADRÃO (os 4 serviços do brief). Caminhos relativos a project_root.
monitoring_required_files:
  - observability/prometheus/prometheus.yml
  - observability/grafana/provisioning/datasources/datasources.yml
  - observability/grafana/provisioning/dashboards/dashboards.yml
  - observability/grafana/dashboards/http-server-projeto-korp-dashboard.json

# Configuração consumida SÓ pelos serviços do perfil `full`. Fora do perfil ela é inerte (nenhum
# container a monta), por isso é exigida apenas no perfil estendido — e não é removida no perfil padrão: apagar arquivo
# versionado que ninguém lê só sujaria a árvore de trabalho.
monitoring_required_files_full:
  - observability/alertmanager/alertmanager.yml
  - observability/blackbox/blackbox.yml

# Containers esperados em execução. Perfil padrão = os 4 do desafio; o estendido acrescenta os 5 opcionais.
monitoring_containers_base:
  - http-server-projeto-korp
  - nginx
  - prometheus
  - grafana
monitoring_containers_full:
  - alertmanager
  - cadvisor
  - node-exporter
  - blackbox-exporter
  - nginx-exporter
monitoring_containers_expected: >-
  {{ monitoring_containers_base
     + ((monitoring_profile_full | bool) | ternary(monitoring_containers_full, [])) }}

# Serviços do perfil `full` cuja prontidão é confirmada pelo `up` do Prometheus. Os exporters não
# expõem endpoint de prontidão próprio: estar UP no scrape É a prova de que respondem.
monitoring_ready_containers_full: []
monitoring_ready_jobs_full:
  - cadvisor
  - node
  - nginx
  - blackbox-exporter

monitoring_ready_retries: 20
monitoring_ready_delay: 6
